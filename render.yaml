services:
  - type: web
    name: darkhanforum
    env: python
    buildCommand: bash build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT DarkhanForum.asgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SECRET_KEY
        generateValue: true
    disks:
      - name: media
        mountPath: /opt/render/project/src/media
        sizeGB: 1
